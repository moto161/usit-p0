[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "usit-p0"
version = "0.1.0"
description = "Evidence-linked software understanding, business analysis, and intelligent test planning toolkit"
requires-python = ">=3.10"
dependencies = ["cryptography==50.0.2"]
[project.scripts]
usit = "usit.cli:main"
[tool.setuptools.packages.find]
include = ["usit*"]
