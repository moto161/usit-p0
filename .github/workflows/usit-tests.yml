name: USIT P0 tests

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned parser dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run built-in selftest
        run: python -m usit.cli selftest
