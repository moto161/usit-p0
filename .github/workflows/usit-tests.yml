name: USIT P0 tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usit-p0-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned parser dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run focused security regressions
        run: >-
          python -m unittest
          tests.test_security_hardening_regressions
          tests.test_business_semantics
          tests.test_parser_contract.ParserContractTests.test_javascript_typescript_semantic_fixture_and_jvm_honest_fallback
          tests.test_p079_stdlib_semantics
          tests.test_p0713_android_adapter.CliIntegrationTests.test_inspect_android_writes_two_files_and_does_not_execute
          -v
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run built-in selftest
        run: python -m usit.cli selftest
