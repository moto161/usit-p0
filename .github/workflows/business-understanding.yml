name: USIT business-understanding tests

on:
  push:
    branches:
      - main
      - feature/understanding-to-test-v1
  pull_request:
    branches:
      - main

jobs:
  business-understanding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run business semantics and test-planner tests
        run: python -m unittest tests.test_business_semantics tests.test_business_test_planner tests.test_business_test_cli -v
      - name: Run USIT self-test
        run: python -m usit selftest
