name: USIT business-understanding tests

on:
  push:
    branches:
      - main
      - feature/understanding-to-test-v1
      - feature/business-function-graph-v1
  pull_request:
    branches:
      - main

jobs:
  business-understanding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Python runtime dependencies
        run: python -m pip install 'cryptography==50.0.2'
      - name: Install the pinned local TypeScript parser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run business understanding and call-ownership tests
        run: python -m unittest tests.test_business_semantics tests.test_business_test_planner tests.test_business_test_cli tests.test_test_result_importer tests.test_pytest_result_importer tests.test_test_report_adapters tests.test_coverage_result_importer tests.test_business_evidence_verifier tests.test_verification_gap_analyzer tests.test_project_quality_assessment tests.test_business_traceability tests.test_traceability_template tests.test_business_graph tests.test_database_access tests.test_permission_evidence tests.test_python_resolver tests.test_security_test_planner tests.test_identity_evidence tests.test_identity_graph tests.test_runtime_evidence tests.test_android_event_adapter tests.test_ai_gateway tests.test_ai_orchestrator tests.test_ai_claim_review tests.test_ai_evidence_binding tests.test_scan_attestation tests.test_p074_identity_ctime tests.test_p079_public_paths tests.test_js_ts_adapter_regressions -v
      - name: Run USIT self-test
        run: python -m usit selftest
      - name: Run full repository regression suite (baseline comparison)
        continue-on-error: true
        run: python -m unittest discover -s tests -v

  windows-regression:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the pinned local TypeScript parser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run USIT self-test on Windows
        run: python -m usit selftest
      - name: Run full repository regression suite on Windows (baseline comparison)
        continue-on-error: true
        run: python -m unittest discover -s tests -v
  main-baseline-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the pinned local TypeScript parser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run main baseline self-test
        run: python -m usit selftest
      - name: Run main baseline full repository suite (exclude interrupt-test harness defect)
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import unittest

          excluded = "VerificationCaptureTests.test_keyboard_interrupt_terminates_child_and_records_returncode"
          loader = unittest.TestLoader()
          discovered = loader.discover("tests")

          def filtered(suite):
              result = unittest.TestSuite()
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      result.addTests(filtered(item))
                  elif not item.id().endswith(excluded):
                      result.addTest(item)
              return result

          outcome = unittest.TextTestRunner(verbosity=2).run(filtered(discovered))
          raise SystemExit(0 if outcome.wasSuccessful() else 1)
          PY
