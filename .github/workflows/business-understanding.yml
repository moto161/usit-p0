name: USIT business-understanding tests

on:
  push:
    branches:
      - main
      - feature/understanding-to-test-v1
      - feature/business-function-graph-v1
  pull_request:
    branches:
      - main

jobs:
  business-understanding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the pinned local TypeScript parser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run business understanding and call-ownership tests
        run: python -m unittest tests.test_business_semantics tests.test_business_test_planner tests.test_business_test_cli tests.test_test_result_importer tests.test_test_report_adapters tests.test_coverage_result_importer tests.test_business_graph tests.test_database_access tests.test_permission_evidence tests.test_python_resolver tests.test_security_test_planner tests.test_identity_evidence tests.test_identity_graph -v
      - name: Run USIT self-test
        run: python -m usit selftest
