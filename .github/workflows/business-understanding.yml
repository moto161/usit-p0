name: USIT business-understanding tests

# Main-branch validation workflow (backported with the main-baseline fixes).
# main never had a workflow file, so no CI ran on PRs targeting main at all.
# This is the minimal main-adapted version of the feature branch's workflow:
# the gate is the full filtered discovery (584 tests) on Linux and Windows,
# plus the main-baseline diagnostic jobs. It deliberately omits the
# isolation-regression job: UID isolation (capture_run(user=)) exists only on
# the feature branch, so there is nothing to isolate on main. When
# feature/understanding-to-test-v1 merges, its workflow (with the full
# business-understanding gate lists) replaces this file.

# Keep only the newest validation for a branch; push and PR events share
# the same group so stale queued runs cannot starve the current HEAD.
concurrency:
  group: usit-validation-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  business-understanding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned Python runtime dependencies
        run: python -m pip install 'cryptography==50.0.2' 'pytest==8.3.5'
      - name: Install the pinned local TypeScript parser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run USIT self-test
        run: python -m usit selftest
      - name: Run main full regression suite (gating; one known interrupt-test harness case excluded)
        run: |
          python - <<'PY'
          import unittest

          excluded = "VerificationCaptureTests.test_keyboard_interrupt_terminates_child_and_records_returncode"
          loader = unittest.TestLoader()
          discovered = loader.discover("tests")

          def filtered(suite):
              result = unittest.TestSuite()
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      result.addTests(filtered(item))
                  elif not item.id().endswith(excluded):
                      result.addTest(item)
              return result

          outcome = unittest.TextTestRunner(verbosity=2).run(filtered(discovered))
          raise SystemExit(0 if outcome.wasSuccessful() else 1)
          PY

  windows-regression:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned Python runtime dependencies
        run: python -m pip install 'cryptography==50.0.2' 'pytest==8.3.5'
      - name: Install the pinned local TypeScript parser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run USIT self-test on Windows
        run: python -m usit selftest
      - name: Run main full regression suite on Windows (gating; same exclusion as Linux)
        run: |
          python - <<'PY'
          import unittest

          excluded = "VerificationCaptureTests.test_keyboard_interrupt_terminates_child_and_records_returncode"
          loader = unittest.TestLoader()
          discovered = loader.discover("tests")

          def filtered(suite):
              result = unittest.TestSuite()
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      result.addTests(filtered(item))
                  elif not item.id().endswith(excluded):
                      result.addTest(item)
              return result

          outcome = unittest.TextTestRunner(verbosity=2).run(filtered(discovered))
          raise SystemExit(0 if outcome.wasSuccessful() else 1)
          PY

  main-baseline-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the pinned local TypeScript parser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run main baseline self-test
        run: python -m usit selftest
      - name: Diagnostic main baseline suite (exclude known interrupt-test harness defect; non-gating)
        id: main_baseline_full_regression
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import unittest

          excluded = "VerificationCaptureTests.test_keyboard_interrupt_terminates_child_and_records_returncode"
          loader = unittest.TestLoader()
          discovered = loader.discover("tests")

          def filtered(suite):
              result = unittest.TestSuite()
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      result.addTests(filtered(item))
                  elif not item.id().endswith(excluded):
                      result.addTest(item)
              return result

          outcome = unittest.TextTestRunner(verbosity=2).run(filtered(discovered))
          raise SystemExit(0 if outcome.wasSuccessful() else 1)
          PY
      - name: Report main baseline regression outcome
        if: always()
        env:
          REGRESSION_OUTCOME: ${{ steps.main_baseline_full_regression.outcome }}
        run: |
          python -c "import os; from pathlib import Path; p=Path(os.environ['GITHUB_STEP_SUMMARY']); p.write_text(chr(10).join(['### Main baseline regression (diagnostic)', '', '- Outcome: **' + os.environ['REGRESSION_OUTCOME'] + '**', '- One known interrupt-test harness case is excluded; this is not a complete pass claim.']) + chr(10), encoding='utf-8')"
